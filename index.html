<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>UPI Split Controller</title>
  
  <link href="https://googleapis.com" rel="stylesheet">
  
  <!-- Universally compatible pure JS decoder engine -->
  <script src="https://jsdelivr.net"></script>

  <style>
    :root {
      --primary-color: #1a4384; 
      --primary-hover: #123263;
      --text-color: #333333;
      --border-color: #d1d5db;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: 'Inter', sans-serif;
    }

    body {
      background-color: #f8fafc;
      display: flex;
      justify-content: center;
      align-items: flex-start;
      min-height: 100vh;
      padding: 20px 0;
    }

    .app-wrapper {
      width: 100%;
      max-width: 440px;
      background: #ffffff;
      border-radius: 24px;
      overflow: hidden;
      box-shadow: 0 10px 25px rgba(0, 0, 0, 0.05);
    }

    .app-header {
      background: linear-gradient(180deg, #1e4b8f 0%, #163c75 100%);
      padding: 35px 20px;
      text-align: center;
    }

    .app-header h1 {
      color: #ffffff;
      font-size: 22px;
      font-weight: 600;
      letter-spacing: 0.5px;
    }

    .form-container {
      padding: 30px 24px;
    }

    .input-group {
      margin-bottom: 24px;
    }

    .input-group label {
      display: block;
      font-size: 14px;
      font-weight: 600;
      color: #4b5563;
      margin-bottom: 8px;
    }

    input[type="text"], input[type="number"] {
      width: 100%;
      padding: 14px 16px;
      font-size: 16px;
      border: 1px solid var(--border-color);
      border-radius: 12px;
      outline: none;
      color: var(--text-color);
      transition: border-color 0.2s;
    }

    input[type="text"]:focus, input[type="number"]:focus {
      border-color: var(--primary-color);
    }

    .scanner-options-row {
      display: flex;
      gap: 10px;
      margin-top: 10px;
    }

    .action-badge-btn {
      flex: 1;
      background: #f1f5f9;
      border: 1px solid var(--border-color);
      border-radius: 12px;
      padding: 12px;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
      font-weight: 500;
      font-size: 14px;
      color: #4b5563;
      transition: all 0.2s;
    }

    .action-badge-btn:hover {
      background: #e2e8f0;
    }

    .hidden-input {
      display: none !important;
    }

    .submit-btn {
      width: 100%;
      background: var(--primary-color);
      color: #ffffff;
      border: none;
      padding: 16px;
      font-size: 16px;
      font-weight: 600;
      border-radius: 12px;
      cursor: pointer;
      box-shadow: 0 4px 12px rgba(26, 67, 132, 0.2);
      transition: background 0.2s;
      margin-top: 10px;
    }

    .submit-btn:hover {
      background: var(--primary-hover);
    }
  </style>
</head>
<body>

  <div class="app-wrapper">
    <div class="app-header">
      <h1>UPI Split Controller</h1>
    </div>

    <form class="form-container" onsubmit="event.preventDefault();">
      
      <div class="input-group">
        <label for="upi-id">Destination UPI ID</label>
        <input type="text" id="upi-id" placeholder="e.g., store@okaxis" required>
        
        <div class="scanner-options-row">
          <button type="button" class="action-badge-btn" id="btn-camera">📷 SCANNER</button>
          <button type="button" class="action-badge-btn" id="btn-gallery">🖼️ UPLOAD UPI</button>
        </div>

        <input type="file" id="input-camera" accept="image/*" capture="environment" class="hidden-input">
        <input type="file" id="input-gallery" accept="image/*" class="hidden-input">
      </div>

      <div class="input-group">
        <label for="payee-name">Payee Name</label>
        <input type="text" id="payee-name" placeholder="e.g., Raju Kirana Store" required>
      </div>

      <div class="input-group">
        <label for="bill-amount">Total Bill Amount (₹)</label>
        <input type="number" id="bill-amount" placeholder="e.g., 5000" required>
      </div>

      <button type="submit" class="submit-btn">Generate Split Links</button>
    </form>
  </div>

  <script>
    const btnCamera = document.getElementById('btn-camera');
    const btnGallery = document.getElementById('btn-gallery');
    const inputCamera = document.getElementById('input-camera');
    const inputGallery = document.getElementById('input-gallery');
    
    const upiInput = document.getElementById('upi-id');
    const nameInput = document.getElementById('payee-name');

    btnCamera.addEventListener('click', () => inputCamera.click());
    btnGallery.addEventListener('click', () => inputGallery.click());

    inputCamera.addEventListener('change', (e) => startProcessingQR(e.target.files));
    inputGallery.addEventListener('change', (e) => startProcessingQR(e.target.files));

    function startProcessingQR(files) {
      if (!files || files.length === 0) return;

      const file = files[0];
      const reader = new FileReader();

      reader.onload = function(event) {
        const img = new Image();
        img.onload = function() {
          const canvas = document.createElement('canvas');
          const ctx = canvas.getContext('2d');

          // Fit image sizes nicely to optimize browser layout
          const limitSize = 800;
          let width = img.width;
          let height = img.height;

          if (width > limitSize || height > limitSize) {
            if (width > height) {
              height = Math.round((height * limitSize) / width);
              width = limitSize;
            } else {
              width = Math.round((width * limitSize) / height);
              height = limitSize;
            }
          }

          canvas.width = width;
          canvas.height = height;
          ctx.drawImage(img, 0, 0, width, height);

          try {
            const buffer = ctx.getImageData(0, 0, width, height);
            // Execute standalone embedded engine module logic
            const qrParsedData = jsQR(buffer.data, buffer.width, buffer.height, {
              inversionAttempts: "dontInvert"
            });

            if (qrParsedData && qrParsedData.data) {
              processUPIDataFields(qrParsedData.data);
            } else {
              alert("No clear QR code detected. Try getting closer or improving the lighting.");
            }
          } catch (err) {
            alert("Error processing file structure details.");
          }
        };
        img.src = event.target.result;
      };
      
      reader.readAsDataURL(file);

      inputCamera.value = "";
      inputGallery.value = "";
    }

    function processUPIDataFields(decodedText) {
      if (decodedText.startsWith("upi://pay")) {
        const queryPart = decodedText.replace("upi://pay", "");
        const queryParams = new URLSearchParams(queryPart);
        
        const address = queryParams.get('pa'); 
        const name = queryParams.get('pn'); 

        if (address) upiInput.value = address;
        if (name) nameInput.value = decodeURIComponent(name);
      } else {
        alert("This QR code layout structure doesn't match standard payment URI setups.");
      }
    }
  </script>
</body>
</html>
