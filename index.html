<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>UPI Payment Controller</title>
  
  <link href="https://googleapis.com" rel="stylesheet">

  <!-- Mobile Progressive Web App Configuration -->
  <meta name="theme-color" content="#1a4384">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  
  <!-- Inline manifest workaround to enable smooth standalone Chrome installation -->
  <link rel="manifest" href="data:application/manifest+json,{%22name%22:%22UPI%20Payment%20Controller%22,%22short_name%22:%22UPI%20Pay%22,%22start_url%22:%22.%22,%22display%22:%22standalone%22,%22background_color%22:%22%23f8fafc%22,%22theme_color%22:%22%231a4384%22,%22icons%22:[{%22src%22:%22data:image/svg+xml;utf8,<svg%20xmlns=%27http://w3.org><rect%20width=%27512%27%20height=%27512%27%20rx=%27128%27%20fill=%27%231a4384%27/><text%20x=%2750%%27%20y=%2765%%27%20font-size=%27240%27%20font-weight=%27bold%27%20fill=%27%23ffffff%27%20text-anchor=%27middle%27%20font-family=%27sans-serif%27>₹</text></svg>%22,%22sizes%22:%22512x512%22,%22type%22:%22image/svg+xml%22,%22purpose%22:%22any%20maskable%22}]}">

  <style>
    :root {
      --primary-color: #1a4384; 
      --primary-hover: #123263;
      --text-color: #333333;
      --border-color: #d1d5db;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: 'Inter', sans-serif;
    }

    body {
      background-color: #f8fafc;
      display: flex;
      flex-direction: column;
      align-items: center;
      min-height: 100vh;
      padding: 20px;
    }

    .app-wrapper {
      width: 100%;
      max-width: 440px;
      background: #ffffff;
      border-radius: 24px;
      overflow: hidden;
      box-shadow: 0 10px 25px rgba(0, 0, 0, 0.05);
      margin-bottom: 20px;
    }

    .app-header {
      background: linear-gradient(180deg, #1e4b8f 0%, #163c75 100%);
      padding: 35px 20px;
      text-align: center;
    }

    .app-header h1 {
      color: #ffffff;
      font-size: 22px;
      font-weight: 600;
      letter-spacing: 0.5px;
    }

    .form-container {
      padding: 30px 24px;
    }

    .input-group {
      margin-bottom: 24px;
    }

    .input-group label {
      display: block;
      font-size: 14px;
      font-weight: 600;
      color: #4b5563;
      margin-bottom: 8px;
    }

    .input-row-vertical {
      display: flex;
      flex-direction: column;
      gap: 10px;
      width: 100%;
    }

    input[type="text"], input[type="number"] {
      width: 100%;
      padding: 14px 16px;
      font-size: 16px;
      border: 1px solid var(--border-color);
      border-radius: 12px;
      outline: none;
      color: var(--text-color);
      transition: border-color 0.2s;
    }

    input[type="text"]:focus, input[type="number"]:focus {
      border-color: var(--primary-color);
    }

    .inline-helper-btn {
      background: #f1f5f9;
      border: 1px solid var(--border-color);
      border-radius: 12px;
      padding: 12px;
      cursor: pointer;
      font-weight: 600;
      font-size: 13px;
      color: #1a4384;
      text-align: center;
      width: 100%;
      transition: all 0.2s;
    }

    .inline-helper-btn:hover {
      background: #e2e8f0;
    }

    .submit-btn {
      width: 100%;
      background: var(--primary-color);
      color: #ffffff;
      border: none;
      padding: 16px;
      font-size: 16px;
      font-weight: 600;
      border-radius: 12px;
      cursor: pointer;
      box-shadow: 0 4px 12px rgba(26, 67, 132, 0.2);
      transition: background 0.2s;
      margin-top: 10px;
    }

    .submit-btn:hover {
      background: var(--primary-hover);
    }

    .quick-info-note {
      font-size: 12px;
      color: #6b7280;
      margin-top: 6px;
      line-height: 1.4;
    }

    .results-container {
      width: 100%;
      max-width: 440px;
      background: #ffffff;
      border-radius: 24px;
      padding: 24px;
      box-shadow: 0 10px 25px rgba(0, 0, 0, 0.05);
      display: none;
    }

    .results-title {
      font-size: 16px;
      font-weight: 600;
      color: #1e4b8f;
      margin-bottom: 16px;
    }

    .split-item {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 14px;
      background: #f8fafc;
      border: 1px solid #e2e8f0;
      border-radius: 16px;
      margin-bottom: 12px;
    }
    
    .split-item:last-child {
      margin-bottom: 0;
    }

    .split-body-info {
      flex: 1;
    }

    .split-name { font-weight: 600; color: #333; font-size: 14px; }
    .split-amt { font-size: 15px; font-weight: 600; color: #1a4384; margin-top: 2px; }

    .action-row {
      display: flex;
      gap: 6px;
      margin-top: 10px;
    }

    .action-btn {
      padding: 8px 12px;
      font-size: 12px;
      font-weight: 500;
      border-radius: 8px;
      cursor: pointer;
      border: none;
      text-align: center;
    }

    .copy-btn { background: #e2e8f0; color: #333; flex: 1; }
    .pay-btn { background: #1a4384; color: #fff; text-decoration: none; flex: 1; }
  </style>
</head>
<body>

  <div class="app-wrapper">
    <div class="app-header">
      <h1>UPI Payment Controller</h1>
    </div>

    <form class="form-container" id="split-form" onsubmit="event.preventDefault();">
      <div class="input-group">
        <label for="upi-id">Destination UPI ID</label>
        <div class="input-row-vertical">
          <input type="text" id="upi-id" placeholder="e.g., store@okaxis" required>
          <button type="button" class="inline-helper-btn" id="btn-paste">📋 Paste Copied Link</button>
        </div>
        <p class="quick-info-note">Tip: You can paste a standard text handle or an extracted UPI deep link here.</p>
      </div>

      <div class="input-group">
        <label for="payee-name">Payee Name</label>
        <input type="text" id="payee-name" placeholder="e.g., Raju Kirana Store" required>
      </div>

      <div class="input-group">
        <label for="bill-amount">Total Bill Amount (₹)</label>
        <input type="number" id="bill-amount" placeholder="e.g., 5000" required>
      </div>

      <button type="submit" class="submit-btn" id="btn-submit">Generate Payment Links</button>
    </form>
  </div>

  <div class="results-container" id="results-box">
    <h2 class="results-title">Payment Targets (Max ₹1,999 per Link)</h2>
    <div id="links-list"></div>
  </div>

  <script>
    const upiInput = document.getElementById('upi-id');
    const nameInput = document.getElementById('payee-name');
    const amountInput = document.getElementById('bill-amount');
    const btnPaste = document.getElementById('btn-paste');
    const splitForm = document.getElementById('split-form');
    const resultsBox = document.getElementById('results-box');
    const linksList = document.getElementById('links-list');

    // Inline Service Worker setup block to satisfy PWA criteria directly
    if ('serviceWorker' in navigator) {
      window.addEventListener('load', () => {
        const swBlob = new Blob([`
          self.addEventListener('install', (e) => self.skipWaiting());
          self.addEventListener('fetch', (e) => e.respondWith(fetch(e.request)));
        `], { type: 'application/javascript' });
        navigator.serviceWorker.register(URL.createObjectURL(swBlob)).catch(() => {});
      });
    }

    btnPaste.addEventListener('click', async () => {
      try {
        const textFromClipboard = await navigator.clipboard.readText();
        if (textFromClipboard) {
          processRawInputText(textFromClipboard.trim());
        }
      } catch (err) {
        const manualStringPrompt = prompt("Paste your copied UPI payment text or link string here:");
        if (manualStringPrompt) {
          processRawInputText(manualStringPrompt.trim());
        }
      }
    });

    upiInput.addEventListener('input', (e) => {
      const incomingValue = e.target.value.trim();
      if (incomingValue.includes('upi://pay') || incomingValue.includes('pa=')) {
        processRawInputText(incomingValue);
      }
    });

    function processRawInputText(rawText) {
      if (rawText.includes("upi://pay") || rawText.includes("pa=")) {
        try {
          let workingUrlSegment = rawText;
          if (rawText.includes("upi://pay")) {
            const startIndexPosition = rawText.indexOf("upi://pay");
            workingUrlSegment = rawText.substring(startIndexPosition);
          }
          
          const parameterString = workingUrlSegment.replace("upi://pay", "").replace("?", "");
          const urlExtractionEngine = new URLSearchParams(parameterString);
          
          const extractedUPIAddress = urlExtractionEngine.get('pa');
          const extractedPayeeName = urlExtractionEngine.get('pn');

          if (extractedUPIAddress) {
            upiInput.value = extractedUPIAddress;
          }
          if (extractedPayeeName) {
            nameInput.value = decodeURIComponent(extractedPayeeName);
          }
        } catch (error) {
          upiInput.value = rawText;
        }
      } else {
        upiInput.value = rawText;
      }
    }

    splitForm.addEventListener('submit', (e) => {
      e.preventDefault();
      
      const upiId = upiInput.value.trim();
      const payeeName = nameInput.value.trim();
      let remainingAmount = parseFloat(amountInput.value);

      linksList.innerHTML = '';
      const maxTrancheLimit = 1999.00;
      let installmentCounter = 1;

      while (remainingAmount > 0) {
        let currentTrancheAmount = remainingAmount > maxTrancheLimit ? maxTrancheLimit : remainingAmount;
        currentTrancheAmount = parseFloat(currentTrancheAmount).toFixed(2);
