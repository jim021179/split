<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>UPI Split Dashboard</title>
    <style>
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            background-color: #f7f9fc;
            margin: 0;
            padding: 0;
            display: flex;
            justify-content: center;
        }
        .app-container {
            width: 100%;
            max-width: 480px;
            background-color: #ffffff;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            box-shadow: 0 0 20px rgba(0,0,0,0.05);
        }
        .header {
            background: linear-gradient(135deg, #1e3c72 0%, #2a5298 100%);
            color: white;
            padding: 35px 20px;
            text-align: center;
            border-bottom-left-radius: 24px;
            border-bottom-right-radius: 24px;
        }
        .header h1 {
            margin: 0;
            font-size: 24px;
            font-weight: 600;
        }
        .content {
            padding: 24px 20px;
            flex-grow: 1;
        }
        .input-card {
            background: #ffffff;
            border: 1px solid #e9ecef;
            border-radius: 16px;
            padding: 20px;
            box-shadow: 0 4px 6px rgba(0,0,0,0.02);
            margin-bottom: 20px;
        }
        .input-group {
            margin-bottom: 16px;
            text-align: left;
        }
        .input-group label {
            display: block;
            font-size: 14px;
            font-weight: 600;
            color: #495057;
            margin-bottom: 6px;
        }
        .input-group input {
            width: 100%;
            padding: 14px;
            border: 1px solid #ced4da;
            border-radius: 10px;
            font-size: 16px;
            box-sizing: border-box;
            background-color: #f8f9fa;
            transition: border-color 0.2s;
        }
        .input-group input:focus {
            border-color: #2a5298;
            outline: none;
            background-color: #ffffff;
        }
        .calc-btn {
            width: 100%;
            padding: 16px;
            background: linear-gradient(135deg, #2a5298 0%, #1e3c72 100%);
            color: white;
            border: none;
            border-radius: 12px;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
            box-shadow: 0 4px 6px rgba(42, 82, 152, 0.2);
        }
        .section-title {
            font-size: 14px;
            font-weight: 600;
            color: #6c757d;
            text-transform: uppercase;
            margin-top: 10px;
            margin-bottom: 16px;
            letter-spacing: 0.5px;
        }
        .payment-card {
            background: #f8f9fa;
            border: 1px solid #e9ecef;
            border-radius: 16px;
            padding: 16px;
            margin-bottom: 14px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        .card-details {
            display: flex;
            flex-direction: column;
        }
        .part-label {
            font-size: 14px;
            color: #495057;
            margin-bottom: 4px;
        }
        .part-amount {
            font-size: 20px;
            font-weight: 700;
            color: #212529;
        }
        .pay-btn {
            background-color: #28a745;
            color: white;
            text-decoration: none;
            padding: 12px 24px;
            font-weight: 600;
            border-radius: 10px;
            font-size: 15px;
            box-shadow: 0 4px 6px rgba(40, 167, 69, 0.15);
        }
    </style>
</head>
<body>
    <div class="app-container">
        <div class="header">
            <h1>UPI Split Controller</h1>
        </div>
        <div class="content">
            <div class="input-card">
                <div class="input-group">
                    <label>Destination UPI ID</label>
                    <input type="text" id="upiId" placeholder="e.g., store@okaxis">
                </div>
                <div class="input-group">
                    <label>Payee Name</label>
                    <input type="text" id="payeeName" placeholder="e.g., Raju Kirana Store">
                </div>
                <div class="input-group">
                    <label>Total Bill Amount (₹)</label>
                    <input type="number" id="totalAmount" placeholder="e.g., 5000">
                </div>
                <button class="calc-btn" onclick="generateSplits()">Generate Split Links</button>
            </div>
            
            <div id="resultSection" style="display: none;">
                <div class="section-title">Required Split Transactions</div>
                <div id="buttonArea"></div>
            </div>
        </div>
    </div>

    <script>
        function generateSplits() {
            const upiId = document.getElementById('upiId').value.trim();
            const payeeName = document.getElementById('payeeName').value.trim();
            let amount = parseFloat(document.getElementById('totalAmount').value) || 0;
            const buttonArea = document.getElementById('buttonArea');
            const resultSection = document.getElementById('resultSection');
            
            buttonArea.innerHTML = "";

            if (!upiId || amount <= 0) {
                alert("Please fill in a valid UPI ID and Amount!");
                return;
            }

            let installments = [];
            if (amount > 1999) {
                while (amount > 0) {
                    let chunk = Math.min(amount, 1999);
                    installments.push(chunk);
                    amount -= chunk;
                }
            } else {
                installments.push(amount);
            }

            installments.forEach((amt, idx) => {
                let upiUri = `upi://pay?pa=${upiId}&pn=${encodeURIComponent(payeeName)}&am=${amt.toFixed(2)}&cu=INR`;
                let title = installments.length > 1 ? `Pay Part ${idx + 1}` : "Complete Payment";
                
                buttonArea.innerHTML += `
                    <div class="payment-card">
                        <div class="card-details">
                            <span class="part-label">${title}</span>
                            <span class="part-amount">₹${amt.toFixed(2)}</span>
                        </div>
                        <a href="${upiUri}" class="pay-btn">Pay Now</a>
                    </div>
                `;
            });

            resultSection.style.display = "block";
        }
    </script>
</body>
</html>
