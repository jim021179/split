<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>UPI Split Controller</title>
  
  <link href="https://googleapis.com" rel="stylesheet">

  <style>
    :root {
      --primary-color: #1a4384; 
      --primary-hover: #123263;
      --text-color: #333333;
      --border-color: #d1d5db;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: 'Inter', sans-serif;
    }

    body {
      background-color: #f8fafc;
      display: flex;
      justify-content: center;
      align-items: flex-start;
      min-height: 100vh;
      padding: 20px 0;
    }

    .app-wrapper {
      width: 100%;
      max-width: 440px;
      background: #ffffff;
      border-radius: 24px;
      overflow: hidden;
      box-shadow: 0 10px 25px rgba(0, 0, 0, 0.05);
    }

    .app-header {
      background: linear-gradient(180deg, #1e4b8f 0%, #163c75 100%);
      padding: 35px 20px;
      text-align: center;
    }

    .app-header h1 {
      color: #ffffff;
      font-size: 22px;
      font-weight: 600;
      letter-spacing: 0.5px;
    }

    .form-container {
      padding: 30px 24px;
    }

    .input-group {
      margin-bottom: 24px;
    }

    .input-group label {
      display: block;
      font-size: 14px;
      font-weight: 600;
      color: #4b5563;
      margin-bottom: 8px;
    }

    /* Layout handling custom styled inputs */
    .input-row {
      display: flex;
      gap: 8px;
    }

    input[type="text"], input[type="number"] {
      width: 100%;
      padding: 14px 16px;
      font-size: 16px;
      border: 1px solid var(--border-color);
      border-radius: 12px;
      outline: none;
      color: var(--text-color);
      transition: border-color 0.2s;
    }

    input[type="text"]:focus, input[type="number"]:focus {
      border-color: var(--primary-color);
    }

    .inline-helper-btn {
      background: #f1f5f9;
      border: 1px solid var(--border-color);
      border-radius: 12px;
      padding: 0 14px;
      cursor: pointer;
      font-weight: 500;
      font-size: 13px;
      color: #1a4384;
      white-space: nowrap;
      transition: all 0.2s;
    }

    .inline-helper-btn:hover {
      background: #e2e8f0;
    }

    .submit-btn {
      width: 100%;
      background: var(--primary-color);
      color: #ffffff;
      border: none;
      padding: 16px;
      font-size: 16px;
      font-weight: 600;
      border-radius: 12px;
      cursor: pointer;
      box-shadow: 0 4px 12px rgba(26, 67, 132, 0.2);
      transition: background 0.2s;
      margin-top: 10px;
    }

    .submit-btn:hover {
      background: var(--primary-hover);
    }

    .quick-info-note {
      font-size: 12px;
      color: #6b7280;
      margin-top: 6px;
      line-height: 1.4;
    }
  </style>
</head>
<body>

  <div class="app-wrapper">
    <div class="app-header">
      <h1>UPI Split Controller</h1>
    </div>

    <form class="form-container" id="split-form" onsubmit="event.preventDefault();">
      
      <!-- Target Field 1: UPI ID entry with instant clipboard parsing helper -->
      <div class="input-group">
        <label for="upi-id">Destination UPI ID</label>
        <div class="input-row">
          <input type="text" id="upi-id" placeholder="e.g., store@okaxis" required>
          <button type="button" class="inline-helper-btn" id="btn-paste">📋 Paste Copied Link</button>
        </div>
        <p class="quick-info-note">Tip: You can paste a standard text string or an extracted UPI deep link (`upi://pay...`) here, and it will fill automatically.</p>
      </div>

      <!-- Target Field 2: Payee Name input block -->
      <div class="input-group">
        <label for="payee-name">Payee Name</label>
        <input type="text" id="payee-name" placeholder="e.g., Raju Kirana Store" required>
      </div>

      <!-- Target Field 3: Total Bill Amount numeric setup config -->
      <div class="input-group">
        <label for="bill-amount">Total Bill Amount (₹)</label>
        <input type="number" id="bill-amount" placeholder="e.g., 5000" required>
      </div>

      <button type="submit" class="submit-btn">Generate Split Links</button>
    </form>
  </div>

  <script>
    const upiInput = document.getElementById('upi-id');
    const nameInput = document.getElementById('payee-name');
    const btnPaste = document.getElementById('btn-paste');

    // Clipboard parsing integration block
    btnPaste.addEventListener('click', async () => {
      try {
        const textFromClipboard = await navigator.clipboard.readText();
        if (textFromClipboard) {
          processRawInputText(textFromClipboard.trim());
        }
      } catch (err) {
        // Fallback option if clipboard system permissions are explicitly restricted
        const manualStringPrompt = prompt("Paste your copied UPI payment text or link string here:");
        if (manualStringPrompt) {
          processRawInputText(manualStringPrompt.trim());
        }
      }
    });

    // Handle manual pasting directly into the box field as well
    upiInput.addEventListener('input', (e) => {
      const incomingValue = e.target.value.trim();
      if (incomingValue.includes('upi://pay') || incomingValue.includes('pa=')) {
        processRawInputText(incomingValue);
      }
    });

    // Central text router engine
    function processRawInputText(rawText) {
      if (rawText.includes("upi://pay") || rawText.includes("pa=")) {
        try {
          // Clean text structures if deep-link parameters are enclosed inside wider query text blocks
          let workingUrlSegment = rawText;
          if (rawText.contains && rawText.includes("upi://pay")) {
            const startIndexPosition = rawText.indexOf("upi://pay");
            workingUrlSegment = rawText.substring(startIndexPosition);
          }
          
          const parameterString = workingUrlSegment.replace("upi://pay", "").replace("?", "");
          const urlExtractionEngine = new URLSearchParams(parameterString);
          
          const extractedUPIAddress = urlExtractionEngine.get('pa');
          const extractedPayeeName = urlExtractionEngine.get('pn');

          if (extractedUPIAddress) {
            upiInput.value = extractedUPIAddress;
          }
          if (extractedPayeeName) {
            nameInput.value = decodeURIComponent(extractedPayeeName);
          }
        } catch (error) {
          // If formatting drops parameters, fall back safely to passing the raw value
          upiInput.value = rawText;
        }
      } else {
        // Safe mapping configuration option
        upiInput.value = rawText;
      }
    }
  </script>
</body>
</html>
