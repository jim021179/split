<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>UPI Payment Controller</title>
  
  <link href="https://googleapis.com" rel="stylesheet">
  <!-- Load standard zero-dependency QR code rendering module -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>

  <style>
    :root {
      --primary-color: #1a4384; 
      --primary-hover: #123263;
      --text-color: #333333;
      --border-color: #d1d5db;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: 'Inter', sans-serif;
    }

    body {
      background-color: #f8fafc;
      display: flex;
      flex-direction: column;
      align-items: center;
      min-height: 100vh;
      padding: 20px;
    }

    .app-wrapper {
      width: 100%;
      max-width: 440px;
      background: #ffffff;
      border-radius: 24px;
      overflow: hidden;
      box-shadow: 0 10px 25px rgba(0, 0, 0, 0.05);
      margin-bottom: 20px;
    }

    .app-header {
      background: linear-gradient(180deg, #1e4b8f 0%, #163c75 100%);
      padding: 35px 20px;
      text-align: center;
    }

    .app-header h1 {
      color: #ffffff;
      font-size: 22px;
      font-weight: 600;
      letter-spacing: 0.5px;
    }

    .form-container {
      padding: 30px 24px;
    }

    .input-group {
      margin-bottom: 20px;
    }

    .input-group label {
      display: block;
      font-size: 14px;
      font-weight: 600;
      color: #4b5563;
      margin-bottom: 8px;
    }

    /* Fixed Layout Stack: Keeps everything flowing sequentially */
    .input-row-vertical {
      display: flex;
      flex-direction: column;
      gap: 10px;
      width: 100%;
    }

    input[type="text"], input[type="number"] {
      width: 100%;
      padding: 14px 16px;
      font-size: 15px;
      border: 1px solid var(--border-color);
      border-radius: 12px;
      outline: none;
      color: var(--text-color);
      transition: border-color 0.2s;
    }

    input[type="text"]:focus, input[type="number"]:focus {
      border-color: var(--primary-color);
    }

    .inline-helper-btn {
      background: #f1f5f9;
      border: 1px solid var(--border-color);
      border-radius: 12px;
      padding: 12px;
      cursor: pointer;
      font-weight: 600;
      font-size: 13px;
      color: #1a4384;
      text-align: center;
      width: 100%;
      transition: all 0.2s;
    }

    .inline-helper-btn:hover {
      background: #e2e8f0;
    }

    .submit-btn {
      width: 100%;
      background: var(--primary-color);
      color: #ffffff;
      border: none;
      padding: 16px;
      font-size: 16px;
      font-weight: 600;
      border-radius: 12px;
      cursor: pointer;
      box-shadow: 0 4px 12px rgba(26, 67, 132, 0.2);
      transition: background 0.2s;
      margin-top: 10px;
    }

    .submit-btn:hover {
      background: var(--primary-hover);
    }

    .quick-info-note {
      font-size: 12px;
      color: #6b7280;
      margin-top: 6px;
      line-height: 1.4;
    }

    /* Output Results Layout UI */
    .results-container {
      width: 100%;
      max-width: 440px;
      background: #ffffff;
      border-radius: 24px;
      padding: 24px;
      box-shadow: 0 10px 25px rgba(0, 0, 0, 0.05);
      display: none;
    }

    .results-title {
      font-size: 16px;
      font-weight: 600;
      color: #1e4b8f;
      margin-bottom: 16px;
    }

    .split-item {
      display: flex;
      gap: 12px;
      padding: 14px;
      background: #f8fafc;
      border: 1px solid #e2e8f0;
      border-radius: 16px;
      align-items: center;
    }

    .qr-holder {
      background: #ffffff;
      padding: 6px;
      border-radius: 8px;
      border: 1px solid #e2e8f0;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .split-body-info {
      flex: 1;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
    }

    .split-name { font-weight: 600; color: #333; font-size: 14px; }
    .split-amt { font-size: 15px; font-weight: 600; color: #1a4384; margin-top: 2px; }

    .action-row {
      display: flex;
      gap: 6px;
      margin-top: 10px;
    }

    .action-btn {
      padding: 8px 12px;
      font-size: 12px;
      font-weight: 500;
      border-radius: 8px;
      cursor: pointer;
      border: none;
      text-align: center;
    }

    .copy-btn { background: #e2e8f0; color: #333; flex: 1; }
    .pay-btn { background: #1a4384; color: #fff; text-decoration: none; flex: 1; }
    
    .error-text {
      color: #dc2626;
      font-size: 12px;
      margin-top: 4px;
      font-weight: 500;
    }
  </style>
</head>
<body>

  <div class="app-wrapper">
    <div class="app-header">
      <h1>UPI Payment Controller</h1>
    </div>

    <form class="form-container" id="split-form">
      <div class="input-group">
        <label for="upi-id">Destination UPI ID</label>
        <div class="input-row-vertical">
          <input type="text" id="upi-id" placeholder="name@bankhandle" required>
          <button type="button" class="inline-helper-btn" id="btn-paste">📋 Paste Copied Link</button>
        </div>
        <div id="error-container"></div>
        <p class="quick-info-note">Tip: Standard text handles or links paste here automatically.</p>
      </div>

      <div class="input-group">
        <label for="payee-name">Payee Name</label>
        <input type="text" id="payee-name" placeholder="e.g., Jim" required>
      </div>

      <div class="input-group">
        <label for="bill-amount">Total Bill Amount (₹)</label>
        <input type="number" id="bill-amount" placeholder="e.g., 5000" required>
      </div>

      <button type="submit" class="submit-btn">Generate Payment Link & QR</button>
    </form>
  </div>

  <div class="results-container" id="results-box">
    <h2 class="results-title">Scannable Payment Targets</h2>
    <div id="links-list"></div>
  </div>

  <script>
    const upiInput = document.getElementById('upi-id');
    const nameInput = document.getElementById('payee-name');
    const amountInput = document.getElementById('bill-amount');
    const btnPaste = document.getElementById('btn-paste');
    const splitForm = document.getElementById('split-form');
    const resultsBox = document.getElementById('results-box');
    const linksList = document.getElementById('links-list');
    const errorContainer = document.getElementById('error-container');

    btnPaste.addEventListener('click', async () => {
      try {
        const textFromClipboard = await navigator.clipboard.readText();
        if (textFromClipboard) {
          processRawInputText(textFromClipboard.trim());
        }
      } catch (err) {
        const manualStringPrompt = prompt("Paste your copied UPI payment text or link string here:");
        if (manualStringPrompt) {
          processRawInputText(manualStringPrompt.trim());
        }
      }
    });

    upiInput.addEventListener('input', (e) => {
      const incomingValue = e.target.value.trim();
      if (incomingValue.includes('upi://pay') || incomingValue.includes('pa=')) {
        processRawInputText(incomingValue);
      }
    });

    function processRawInputText(rawText) {
      if (rawText.includes("upi://pay") || rawText.includes("pa=")) {
        try {
          let workingUrlSegment = rawText;
          if (rawText.includes("upi://pay")) {
            const startIndexPosition = rawText.indexOf("upi://pay");
            workingUrlSegment = rawText.substring(startIndexPosition);
          }
          
          const parameterString = workingUrlSegment.replace("upi://pay", "").replace("?", "");
          const urlExtractionEngine = new URLSearchParams(parameterString);
          
          const extractedUPIAddress = urlExtractionEngine.get('pa');
          const extractedPayeeName = urlExtractionEngine.get('pn');

          if (extractedUPIAddress) {
            upiInput.value = extractedUPIAddress;
          }
          if (extractedPayeeName) {
            nameInput.value = decodeURIComponent(extractedPayeeName);
          }
        } catch (error) {
          upiInput.value = rawText;
        }
      } else {
        upiInput.value = rawText;
      }
    }

    // Form Submission Engine - Fixed DOM Node Error Crash
    splitForm.addEventListener('submit', (e) => {
      e.preventDefault();
      
      const upiId = upiInput.value.trim();
      const payeeName = nameInput.value.trim();
      const totalAmount = parseFloat(amountInput.value).toFixed(2);

      // Secure error text handling block via static container target
      if (!upiId.includes('@')) {
        upiInput.style.borderColor = '#dc2626';
        errorContainer.innerHTML = '<p class="error-text">⚠️ Please enter a complete UPI ID containing the @ sign.</p>';
        return;
      }

      // Reset values if valid
      errorContainer.innerHTML = '';
      upiInput.style.borderColor = 'var(--border-color)';

      linksList.innerHTML = '';
      const upiDeepLinkUrl = `upi://pay?pa=${encodeURIComponent(upiId)}&pn=${encodeURIComponent(payeeName)}&am=${totalAmount}&cu=INR`;
      
      const itemTemplate = document.createElement('div');
      itemTemplate.className = 'split-item';
      
      const dynamicQrId = 'qr-node-main';
      
      itemTemplate.innerHTML = `
        <div class="qr-holder" id="${dynamicQrId}"></div>
        <div class="split-body-info">
          <div>
            <span class="split-name">Payment to ${payeeName}</span>
            <span class="split-amt">₹${totalAmount}</span>
          </div>
          <div class="action-row">
            <button type="button" class="action-btn copy-btn" onclick="navigator.clipboard.writeText('${upiDeepLinkUrl}').then(() => alert('Link copied!'))">Copy Link</button>
