<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>UPI Split Controller</title>
  
  <link href="https://googleapis.com" rel="stylesheet">
  <!-- Load a stable, single-file lightweight QR decoder engine -->
  <script src="https://jsdelivr.net"></script>

  <style>
    :root {
      --primary-color: #1a4384; 
      --primary-hover: #123263;
      --text-color: #333333;
      --border-color: #d1d5db;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: 'Inter', sans-serif;
    }

    body {
      background-color: #f8fafc;
      display: flex;
      justify-content: center;
      align-items: flex-start;
      min-height: 100vh;
      padding: 20px 0;
    }

    .app-wrapper {
      width: 100%;
      max-width: 440px;
      background: #ffffff;
      border-radius: 24px;
      overflow: hidden;
      box-shadow: 0 10px 25px rgba(0, 0, 0, 0.05);
    }

    .app-header {
      background: linear-gradient(180deg, #1e4b8f 0%, #163c75 100%);
      padding: 35px 20px;
      text-align: center;
    }

    .app-header h1 {
      color: #ffffff;
      font-size: 22px;
      font-weight: 600;
      letter-spacing: 0.5px;
    }

    .form-container {
      padding: 30px 24px;
    }

    .input-group {
      margin-bottom: 24px;
    }

    .input-group label {
      display: block;
      font-size: 14px;
      font-weight: 600;
      color: #4b5563;
      margin-bottom: 8px;
    }

    input[type="text"], input[type="number"] {
      width: 100%;
      padding: 14px 16px;
      font-size: 16px;
      border: 1px solid var(--border-color);
      border-radius: 12px;
      outline: none;
      color: var(--text-color);
      transition: border-color 0.2s;
    }

    input[type="text"]:focus, input[type="number"]:focus {
      border-color: var(--primary-color);
    }

    .scanner-options-row {
      display: flex;
      gap: 10px;
      margin-top: 10px;
    }

    .action-badge-btn {
      flex: 1;
      background: #f1f5f9;
      border: 1px solid var(--border-color);
      border-radius: 12px;
      padding: 12px;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
      font-weight: 500;
      font-size: 14px;
      color: #4b5563;
      transition: all 0.2s;
    }

    .action-badge-btn:hover {
      background: #e2e8f0;
    }

    /* Keep native file wrappers hidden */
    .hidden-input {
      display: none !important;
    }

    .submit-btn {
      width: 100%;
      background: var(--primary-color);
      color: #ffffff;
      border: none;
      padding: 16px;
      font-size: 16px;
      font-weight: 600;
      border-radius: 12px;
      cursor: pointer;
      box-shadow: 0 4px 12px rgba(26, 67, 132, 0.2);
      transition: background 0.2s;
      margin-top: 10px;
    }

    .submit-btn:hover {
      background: var(--primary-hover);
    }
  </style>
</head>
<body>

  <div class="app-wrapper">
    <div class="app-header">
      <h1>UPI Split Controller</h1>
    </div>

    <form class="form-container" onsubmit="event.preventDefault();">
      
      <!-- Field 1: Destination UPI ID and Scanner UI Buttons -->
      <div class="input-group">
        <label for="upi-id">Destination UPI ID</label>
        <input type="text" id="upi-id" placeholder="e.g., store@okaxis" required>
        
        <div class="scanner-options-row">
          <!-- Button 1: Calls system camera application -->
          <button type="button" class="action-badge-btn" id="btn-camera">
            📷 SCANNER
          </button>
          <!-- Button 2: Calls system device photo gallery gallery picker -->
          <button type="button" class="action-badge-btn" id="btn-gallery">
            🖼️ UPLOAD UPI
          </button>
        </div>

        <!-- Hidden structural elements handling native tasks -->
        <input type="file" id="input-camera" accept="image/*" capture="environment" class="hidden-input">
        <input type="file" id="input-gallery" accept="image/*" class="hidden-input">
      </div>

      <!-- Field 2: Payee Name text input -->
      <div class="input-group">
        <label for="payee-name">Payee Name</label>
        <input type="text" id="payee-name" placeholder="e.g., Raju Kirana Store" required>
      </div>

      <!-- Field 3: Total Bill Amount numeric text input -->
      <div class="input-group">
        <label for="bill-amount">Total Bill Amount (₹)</label>
        <input type="number" id="bill-amount" placeholder="e.g., 5000" required>
      </div>

      <button type="submit" class="submit-btn">
        Generate Split Links
      </button>
    </form>
  </div>

  <script>
    const btnCamera = document.getElementById('btn-camera');
    const btnGallery = document.getElementById('btn-gallery');
    const inputCamera = document.getElementById('input-camera');
    const inputGallery = document.getElementById('input-gallery');
    
    const upiInput = document.getElementById('upi-id');
    const nameInput = document.getElementById('payee-name');

    // Trigger actions mapping custom styled layout buttons to hidden inputs
    btnCamera.addEventListener('click', () => inputCamera.click());
    btnGallery.addEventListener('click', () => inputGallery.click());

    // Event listeners capturing file loading tasks
    inputCamera.addEventListener('change', (e) => processSelectedImageFile(e.target.files));
    inputGallery.addEventListener('change', (e) => processSelectedImageFile(e.target.files));

    // Core scanning method using HTML5 Canvas rendering data extraction processing
    function processSelectedImageFile(fileList) {
      if (fileList.length === 0) return;
      const selectedFile = fileList[0];
      
      const fileReader = new FileReader();
      fileReader.onload = function(event) {
        const imageElement = new Image();
        imageElement.onload = function() {
          // Setup background canvas tracking area context
          const outputCanvas = document.createElement('canvas');
          const canvasContext = outputCanvas.getContext('2d');
          
          outputCanvas.width = imageElement.width;
          outputCanvas.height = imageElement.height;
          canvasContext.drawImage(imageElement, 0, 0, imageElement.width, imageElement.height);
          
          const rawImageData = canvasContext.getImageData(0, 0, outputCanvas.width, outputCanvas.height);
          
          // Execute extraction logic tracking library package
          const scannedCodeResult = jsQR(rawImageData.data, rawImageData.width, rawImageData.height, {
            inversionAttempts: "dontInvert",
          });
          
          if (scannedCodeResult && scannedCodeResult.data) {
            parseAndFillUPIData(scannedCodeResult.data);
          } else {
            alert("Could not detect a clear UPI QR code structure in this image. Please make sure the QR code fills the frame clearly.");
          }
        };
        imageElement.src = event.target.result;
      };
      fileReader.readAsDataURL(selectedFile);
      
      // Clear values buffer allowing repeating tracking actions seamlessly
      inputCamera.value = "";
      inputGallery.value = "";
    }

    // Shared URI string conversion data handler module
    function parseAndFillUPIData(decodedText) {
      if (decodedText.startsWith("upi://pay")) {
        try {
          const parsingQuery = decodedText.replace("upi://pay", "");
          const dataURLParameters = new URLSearchParams(parsingQuery);
          
          const targetUPIAddress = dataURLParameters.get('pa'); 
          const targetPayeeName = dataURLParameters.get('pn'); 

          if (targetUPIAddress) {
            upiInput.value = targetUPIAddress;
          }
          if (targetPayeeName) {
            nameInput.value = decodeURIComponent(targetPayeeName);
          }
        } catch (error) {
          alert("Error structural processing parameters setup configuration.");
        }
      } else {
        alert("This image does not contain a valid payment UPI QR Code format.");
      }
    }
  </script>
</body>
</html>
