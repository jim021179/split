<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>UPI Split Controller</title>
  
  <!-- Font and QR library loading -->
  <link href="https://googleapis.com" rel="stylesheet">
  <script src="https://unpkg.com" type="text/javascript"></script>

  <style>
    :root {
      --primary-color: #1a4384; 
      --primary-hover: #123263;
      --text-color: #333333;
      --border-color: #d1d5db;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: 'Inter', sans-serif;
    }

    body {
      background-color: #f8fafc;
      display: flex;
      justify-content: center;
      align-items: flex-start;
      min-height: 100vh;
      padding: 20px 0;
    }

    .app-wrapper {
      width: 100%;
      max-width: 440px;
      background: #ffffff;
      border-radius: 24px;
      overflow: hidden;
      box-shadow: 0 10px 25px rgba(0, 0, 0, 0.05);
    }

    .app-header {
      background: linear-gradient(180deg, #1e4b8f 0%, #163c75 100%);
      padding: 35px 20px;
      text-align: center;
    }

    .app-header h1 {
      color: #ffffff;
      font-size: 22px;
      font-weight: 600;
      letter-spacing: 0.5px;
    }

    .form-container {
      padding: 30px 24px;
    }

    .input-group {
      margin-bottom: 24px;
    }

    .input-group label {
      display: block;
      font-size: 14px;
      font-weight: 600;
      color: #4b5563;
      margin-bottom: 8px;
    }

    .input-wrapper {
      display: flex;
      gap: 8px;
    }

    input[type="text"], input[type="number"] {
      width: 100%;
      padding: 14px 16px;
      font-size: 16px;
      border: 1px solid var(--border-color);
      border-radius: 12px;
      outline: none;
      color: var(--text-color);
      transition: border-color 0.2s;
    }

    input[type="text"]:focus, input[type="number"]:focus {
      border-color: var(--primary-color);
    }

    /* Actions row layout for styling scan options */
    .scanner-options-row {
      display: flex;
      gap: 10px;
      margin-top: 10px;
    }

    .action-badge-btn {
      flex: 1;
      background: #f1f5f9;
      border: 1px solid var(--border-color);
      border-radius: 12px;
      padding: 12px;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
      font-weight: 500;
      font-size: 14px;
      color: #4b5563;
      transition: all 0.2s;
    }

    .action-badge-btn:hover {
      background: #e2e8f0;
    }

    /* Hidden file element input style hook */
    #hidden-file-input {
      display: none;
    }

    .submit-btn {
      width: 100%;
      background: var(--primary-color);
      color: #ffffff;
      border: none;
      padding: 16px;
      font-size: 16px;
      font-weight: 600;
      border-radius: 12px;
      cursor: pointer;
      box-shadow: 0 4px 12px rgba(26, 67, 132, 0.2);
      transition: background 0.2s;
      margin-top: 10px;
    }

    .submit-btn:hover {
      background: var(--primary-hover);
    }

    /* Fullscreen Modal Camera overlay layout window */
    #camera-overlay {
      display: none;
      position: fixed;
      top: 0;
      left: 0;
      width: 100vw;
      height: 100vh;
      background: rgba(0, 0, 0, 0.9);
      z-index: 9999;
      justify-content: center;
      align-items: center;
      flex-direction: column;
      padding: 20px;
    }

    #qr-reader {
      width: 100%;
      max-width: 360px;
      background: #ffffff;
      border-radius: 16px;
      overflow: hidden;
      padding: 10px;
    }

    .close-camera-btn {
      margin-top: 20px;
      background: #ffffff;
      color: #333;
      border: none;
      padding: 12px 24px;
      font-weight: 600;
      border-radius: 30px;
      cursor: pointer;
    }
  </style>
</head>
<body>

  <div class="app-wrapper">
    <div class="app-header">
      <h1>UPI Split Controller</h1>
    </div>

    <form class="form-container" onsubmit="event.preventDefault();">
      
      <!-- Field 1: Destination UPI ID text box input block -->
      <div class="input-group">
        <label for="upi-id">Destination UPI ID</label>
        <input type="text" id="upi-id" placeholder="e.g., store@okaxis" required>
        
        <!-- Scanner Selection Options Row Configuration -->
        <div class="scanner-options-row">
          <button type="button" class="action-badge-btn" id="open-camera-btn">
            📷 Live Camera
          </button>
          <button type="button" class="action-badge-btn" id="trigger-file-btn">
            🖼️ Upload Image
          </button>
        </div>
        <!-- Hidden input system file selector -->
        <input type="file" id="hidden-file-input" accept="image/*">
      </div>

      <!-- Field 2: Payee Name text box input block -->
      <div class="input-group">
        <label for="payee-name">Payee Name</label>
        <input type="text" id="payee-name" placeholder="e.g., Raju Kirana Store" required>
      </div>

      <!-- Field 3: Total Bill Amount numeric text box input block -->
      <div class="input-group">
        <label for="bill-amount">Total Bill Amount (₹)</label>
        <input type="number" id="bill-amount" placeholder="e.g., 5000" required>
      </div>

      <button type="submit" class="submit-btn">
        Generate Split Links
      </button>
    </form>
  </div>

  <!-- Camera Session Layout Template Overlay Modals -->
  <div id="camera-overlay">
    <div id="qr-reader"></div>
    <button type="button" class="close-camera-btn" id="close-camera-btn">Cancel Scan</button>
  </div>

  <!-- Application Logic Code Section Block -->
  <script>
    const openCameraBtn = document.getElementById('open-camera-btn');
    const closeCameraBtn = document.getElementById('close-camera-btn');
    const triggerFileBtn = document.getElementById('trigger-file-btn');
    const hiddenFileInput = document.getElementById('hidden-file-input');
    const cameraOverlay = document.getElementById('camera-overlay');
    
    const upiInput = document.getElementById('upi-id');
    const nameInput = document.getElementById('payee-name');

    let html5QrScannerInstance = null;

    // --- OPTION A: Live Camera Engine Tracking Setup ---
    openCameraBtn.addEventListener('click', () => {
      cameraOverlay.style.display = 'flex';
      
      html5QrScannerInstance = new Html5QrcodeScanner(
        "qr-reader", 
        { fps: 15, qrbox: { width: 240, height: 240 } },
        /* verbose= */ false
      );

      html5QrScannerInstance.render(onScanSuccess, onScanFailure);
    });

    closeCameraBtn.addEventListener('click', shutDownLiveCameraSession);

    function shutDownLiveCameraSession() {
      if (html5QrScannerInstance) {
        html5QrScannerInstance.clear().then(() => {
          cameraOverlay.style.display = 'none';
          html5QrScannerInstance = null;
        }).catch(err => {
          console.error("Camera reset issue: ", err);
          cameraOverlay.style.display = 'none';
        });
      } else {
        cameraOverlay.style.display = 'none';
      }
    }

    // --- OPTION B: Photo / Screenshot Scanning Logic ---
    triggerFileBtn.addEventListener('click', () => {
      hiddenFileInput.click();
    });

    hiddenFileInput.addEventListener('change', event => {
      if (event.target.files.length === 0) return;
      
      const targetImageFile = event.target.files[0];
      const html5QrCodeLocalScanner = new Html5Qrcode("qr-reader");
      
      // Process file locally using the engine library
      html5QrCodeLocalScanner.scanFile(targetImageFile, true)
        .then(decodedText => {
          onScanSuccess(decodedText);
          hiddenFileInput.value = ""; // Clear file selector buffer field
        })
        .catch(err => {
          alert("Could not detect a clear UPI QR code in this image. Please try another screenshot.");
          hiddenFileInput.value = ""; 
        });
    });

    // --- Parser processing shared system engine module ---
    function onScanSuccess(decodedText) {
      if (decodedText.startsWith("upi://pay")) {
        try {
          const queryBlocks = decodedText.replace("upi://pay", "");
          const searchDataParameters = new URLSearchParams(queryBlocks);
          
          const parsedUPIAddress = searchDataParameters.get('pa'); 
          const parsedPayeeName = searchDataParameters.get('pn'); 

          if (parsedUPIAddress) {
            upiInput.value = parsedUPIAddress;
          }
          if (parsedPayeeName) {
            nameInput.value = decodeURIComponent(parsedPayeeName);
          }

          // Automatically clear screen and close any open cameras if active
          shutDownLiveCameraSession();
        } catch (e) {
          alert("Parsing error when trying to fetch data from the layout configuration parameters.");
        }
      } else {
        alert("This QR code is not a valid standard payment link format destination address mapping.");
        shutDownLiveCameraSession();
      }
    }

    function onScanFailure(error) {
      // Loop kept empty to avoid verbose system logs during continuous framing setup adjustments
    }
  </script>
</body>
</html>
