<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>UPI Split Controller</title>
  
  <link href="https://googleapis.com" rel="stylesheet">
  <!-- Load standard zero-dependency QR code rendering module -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>

  <style>
    :root {
      --primary-color: #1a4384; 
      --primary-hover: #123263;
      --text-color: #333333;
      --border-color: #d1d5db;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: 'Inter', sans-serif;
    }

    body {
      background-color: #f8fafc;
      display: flex;
      flex-direction: column;
      align-items: center;
      min-height: 100vh;
      padding: 20px;
    }

    .app-wrapper {
      width: 100%;
      max-width: 440px;
      background: #ffffff;
      border-radius: 24px;
      overflow: hidden;
      box-shadow: 0 10px 25px rgba(0, 0, 0, 0.05);
      margin-bottom: 20px;
    }

    .app-header {
      background: linear-gradient(180deg, #1e4b8f 0%, #163c75 100%);
      padding: 35px 20px;
      text-align: center;
    }

    .app-header h1 {
      color: #ffffff;
      font-size: 22px;
      font-weight: 600;
      letter-spacing: 0.5px;
    }

    .form-container {
      padding: 30px 24px;
    }

    .input-group {
      margin-bottom: 20px;
    }

    .input-group label {
      display: block;
      font-size: 14px;
      font-weight: 600;
      color: #4b5563;
      margin-bottom: 8px;
    }

    .input-row {
      display: flex;
      gap: 8px;
    }

    input[type="text"], input[type="number"] {
      width: 100%;
      padding: 14px 16px;
      font-size: 16px;
      border: 1px solid var(--border-color);
      border-radius: 12px;
      outline: none;
      color: var(--text-color);
      transition: border-color 0.2s;
    }

    input[type="text"]:focus, input[type="number"]:focus {
      border-color: var(--primary-color);
    }

    .inline-helper-btn {
      background: #f1f5f9;
      border: 1px solid var(--border-color);
      border-radius: 12px;
      padding: 0 14px;
      cursor: pointer;
      font-weight: 500;
      font-size: 13px;
      color: #1a4384;
      white-space: nowrap;
      transition: all 0.2s;
    }

    .inline-helper-btn:hover {
      background: #e2e8f0;
    }

    .submit-btn {
      width: 100%;
      background: var(--primary-color);
      color: #ffffff;
      border: none;
      padding: 16px;
      font-size: 16px;
      font-weight: 600;
      border-radius: 12px;
      cursor: pointer;
      box-shadow: 0 4px 12px rgba(26, 67, 132, 0.2);
      transition: background 0.2s;
      margin-top: 10px;
    }

    .submit-btn:hover {
      background: var(--primary-hover);
    }

    .quick-info-note {
      font-size: 12px;
      color: #6b7280;
      margin-top: 6px;
      line-height: 1.4;
    }

    /* Target Dynamic Participants Entry Engine Layout UI */
    .names-container {
      background: #f8fafc;
      border: 1px dashed var(--border-color);
      border-radius: 12px;
      padding: 16px;
      margin-top: 10px;
    }
    .names-container h3 {
      font-size: 13px;
      color: #4b5563;
      margin-bottom: 10px;
    }
    .name-field-wrap {
      margin-bottom: 8px;
    }
    .name-field-wrap:last-child {
      margin-bottom: 0;
    }

    /* Output Results Layout UI Update with Side QR */
    .results-container {
      width: 100%;
      max-width: 440px;
      background: #ffffff;
      border-radius: 24px;
      padding: 24px;
      box-shadow: 0 10px 25px rgba(0, 0, 0, 0.05);
      display: none;
    }

    .results-title {
      font-size: 16px;
      font-weight: 600;
      color: #1e4b8f;
      margin-bottom: 16px;
    }

    .split-item {
      display: flex;
      gap: 12px;
      padding: 14px;
      background: #f8fafc;
      border: 1px solid #e2e8f0;
      border-radius: 16px;
      margin-bottom: 12px;
      align-items: center;
    }

    .qr-holder {
      background: #ffffff;
      padding: 6px;
      border-radius: 8px;
      border: 1px solid #e2e8f0;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .split-body-info {
      flex: 1;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      height: 100%;
    }

    .split-name { font-weight: 600; color: #333; font-size: 14px; }
    .split-amt { font-size: 15px; font-weight: 600; color: #1a4384; margin-top: 2px; }

    .action-row {
      display: flex;
      gap: 6px;
      margin-top: 10px;
    }

    .action-btn {
      padding: 8px 12px;
      font-size: 12px;
      font-weight: 500;
      border-radius: 8px;
      cursor: pointer;
      border: none;
      text-align: center;
    }

    .copy-btn { background: #e2e8f0; color: #333; flex: 1; }
    .pay-btn { background: #1a4384; color: #fff; text-decoration: none; flex: 1; }
  </style>
</head>
<body>

  <div class="app-wrapper">
    <div class="app-header">
      <h1>UPI Split Controller</h1>
    </div>

    <form class="form-container" id="split-form">
      <div class="input-group">
        <label for="upi-id">Destination UPI ID</label>
        <div class="input-row">
          <input type="text" id="upi-id" placeholder="e.g., store@okaxis" required>
          <button type="button" class="inline-helper-btn" id="btn-paste">📋 Paste Copied Link</button>
        </div>
        <p class="quick-info-note">Tip: You can paste a standard text string or an extracted UPI deep link (`upi://pay...`) here, and it will fill automatically.</p>
      </div>

      <div class="input-group">
        <label for="payee-name">Payee Name</label>
        <input type="text" id="payee-name" placeholder="e.g., Raju Kirana Store" required>
      </div>

      <div class="input-group">
        <label for="bill-amount">Total Bill Amount (₹)</label>
        <input type="number" id="bill-amount" placeholder="e.g., 5000" required>
      </div>

      <div class="input-group">
        <label for="split-count">Number of People to Split With</label>
        <input type="number" id="split-count" placeholder="e.g., 3" min="1" value="2" required>
        
        <!-- Dynamic Subform Block Context -->
        <div class="names-container">
          <h3>Participant Names (Optional)</h3>
          <div id="dynamic-name-inputs"></div>
        </div>
      </div>

      <button type="submit" class="submit-btn">Generate Split Links & QRs</button>
    </form>
  </div>

  <div class="results-container" id="results-box">
    <h2 class="results-title">Scannable Payment Split Targets</h2>
    <div id="links-list"></div>
  </div>

    const resultsBox = document.getElementById('results-box');
    const linksList = document.getElementById('links-list');
    const dynamicNamesBox = document.getElementById('dynamic-name-inputs');

    // Generate dynamic names based on selected number count
    function rebuildNameInputs() {
      const currentCountValue = parseInt(splitInput.value) || 0;
      dynamicNamesBox.innerHTML = '';
      for (let i = 1; i <= currentCountValue; i++) {
        const wrap = document.createElement('div');
        wrap.className = 'name-field-wrap';
        wrap.innerHTML = `<input type="text" class="friend-name-input" data-index="${i}" placeholder="Person ${i} Name">`;
        dynamicNamesBox.appendChild(wrap);
      }
    }

    splitInput.addEventListener('input', rebuildNameInputs);
    rebuildNameInputs(); // Initial running configuration setup

    // Clipboard parsing integration block
    btnPaste.addEventListener('click', async () => {
      try {
        const textFromClipboard = await navigator.clipboard.readText();
        if (textFromClipboard) {
          processRawInputText(textFromClipboard.trim());
        }
      } catch (err) {
        const manualStringPrompt = prompt("Paste your copied UPI payment text or link string here:");
        if (manualStringPrompt) {
          processRawInputText(manualStringPrompt.trim());
        }
      }
    });

    upiInput.addEventListener('input', (e) => {
      const incomingValue = e.target.value.trim();
      if (incomingValue.includes('upi://pay') || incomingValue.includes('pa=')) {
        processRawInputText(incomingValue);
      }
    });

    function processRawInputText(rawText) {
      if (rawText.includes("upi://pay") || rawText.includes("pa=")) {
        try {
          let workingUrlSegment = rawText;
          if (rawText.includes("upi://pay")) {
            const startIndexPosition = rawText.indexOf("upi://pay");
            workingUrlSegment = rawText.substring(startIndexPosition);
          }
          
          const parameterString = workingUrlSegment.replace("upi://pay", "").replace("?", "");
          const urlExtractionEngine = new URLSearchParams(parameterString);
          
          const extractedUPIAddress = urlExtractionEngine.get('pa');
          const extractedPayeeName = urlExtractionEngine.get('pn');

          if (extractedUPIAddress) {
            upiInput.value = extractedUPIAddress;
          }
          if (extractedPayeeName) {
            nameInput.value = decodeURIComponent(extractedPayeeName);
          }
        } catch (error) {
          upiInput.value = rawText;
        }
      } else {
        upiInput.value = rawText;
      }
    }
