<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>UPI Split Controller</title>
  
  <link href="https://googleapis.com" rel="stylesheet">
  <!-- Load the main engine source package link -->
  <script src="https://unpkg.com" type="text/javascript"></script>

  <style>
    :root {
      --primary-color: #1a4384; 
      --primary-hover: #123263;
      --text-color: #333333;
      --border-color: #d1d5db;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: 'Inter', sans-serif;
    }

    body {
      background-color: #f8fafc;
      display: flex;
      justify-content: center;
      align-items: flex-start;
      min-height: 100vh;
      padding: 20px 0;
    }

    .app-wrapper {
      width: 100%;
      max-width: 440px;
      background: #ffffff;
      border-radius: 24px;
      overflow: hidden;
      box-shadow: 0 10px 25px rgba(0, 0, 0, 0.05);
    }

    .app-header {
      background: linear-gradient(180deg, #1e4b8f 0%, #163c75 100%);
      padding: 35px 20px;
      text-align: center;
    }

    .app-header h1 {
      color: #ffffff;
      font-size: 22px;
      font-weight: 600;
      letter-spacing: 0.5px;
    }

    .form-container {
      padding: 30px 24px;
    }

    .input-group {
      margin-bottom: 24px;
    }

    .input-group label {
      display: block;
      font-size: 14px;
      font-weight: 600;
      color: #4b5563;
      margin-bottom: 8px;
    }

    input[type="text"], input[type="number"] {
      width: 100%;
      padding: 14px 16px;
      font-size: 16px;
      border: 1px solid var(--border-color);
      border-radius: 12px;
      outline: none;
      color: var(--text-color);
      transition: border-color 0.2s;
    }

    input[type="text"]:focus, input[type="number"]:focus {
      border-color: var(--primary-color);
    }

    .scanner-options-row {
      display: flex;
      gap: 10px;
      margin-top: 10px;
    }

    .action-badge-btn {
      flex: 1;
      background: #f1f5f9;
      border: 1px solid var(--border-color);
      border-radius: 12px;
      padding: 12px;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
      font-weight: 500;
      font-size: 14px;
      color: #4b5563;
      transition: all 0.2s;
    }

    .action-badge-btn:hover {
      background: #e2e8f0;
    }

    #hidden-file-input {
      display: none;
    }

    .submit-btn {
      width: 100%;
      background: var(--primary-color);
      color: #ffffff;
      border: none;
      padding: 16px;
      font-size: 16px;
      font-weight: 600;
      border-radius: 12px;
      cursor: pointer;
      box-shadow: 0 4px 12px rgba(26, 67, 132, 0.2);
      transition: background 0.2s;
      margin-top: 10px;
    }

    .submit-btn:hover {
      background: var(--primary-hover);
    }

    /* Fixed Modal Popups Setup Configuration */
    #camera-overlay {
      display: none;
      position: fixed;
      top: 0;
      left: 0;
      width: 100vw;
      height: 100vh;
      background: rgba(0, 0, 0, 0.9);
      z-index: 9999;
      justify-content: center;
      align-items: center;
      flex-direction: column;
      padding: 20px;
    }

    /* Target rendering viewing portal layout containerbox */
    #qr-video-container {
      width: 100%;
      max-width: 360px;
      aspect-ratio: 1 / 1;
      background: #000000;
      border-radius: 20px;
      overflow: hidden;
      box-shadow: 0 20px 40px rgba(0,0,0,0.4);
      position: relative;
    }

    #qr-video-container video {
      width: 100% !important;
      height: 100% !important;
      object-fit: cover !important;
    }

    /* Scanning target reticle visualization anchor overlay styling lines */
    .scan-region-highlight {
      border: 2px dashed #3b82f6 !important;
      border-radius: 12px;
    }

    .close-camera-btn {
      margin-top: 25px;
      background: #ffffff;
      color: #333333;
      border: none;
      padding: 14px 36px;
      font-weight: 600;
      font-size: 15px;
      border-radius: 30px;
      cursor: pointer;
      box-shadow: 0 4px 14px rgba(0,0,0,0.3);
    }
  </style>
</head>
<body>

  <div class="app-wrapper">
    <div class="app-header">
      <h1>UPI Split Controller</h1>
    </div>

    <form class="form-container" onsubmit="event.preventDefault();">
      
      <!-- Field 1: Destination UPI ID parameters initialization -->
      <div class="input-group">
        <label for="upi-id">Destination UPI ID</label>
        <input type="text" id="upi-id" placeholder="e.g., store@okaxis" required>
        
        <div class="scanner-options-row">
          <button type="button" class="action-badge-btn" id="open-camera-btn">
            📷 SCANNER
          </button>
          <button type="button" class="action-badge-btn" id="trigger-file-btn">
            🖼️UPLOAD UPI
          </button>
        </div>
        <input type="file" id="hidden-file-input" accept="image/*">
      </div>

      <!-- Field 2: Payee Name parameter entry block -->
      <div class="input-group">
        <label for="payee-name">Payee Name</label>
        <input type="text" id="payee-name" placeholder="e.g., Raju Kirana Store" required>
      </div>

      <!-- Field 3: Total Bill Amount numeric value entry config -->
      <div class="input-group">
        <label for="bill-amount">Total Bill Amount (₹)</label>
        <input type="number" id="bill-amount" placeholder="e.g., 5000" required>
      </div>

      <button type="submit" class="submit-btn">
        Generate Split Links
      </button>
    </form>
  </div>

  <!-- Re-engineered layout template containing raw element blocks -->
  <div id="camera-overlay">
    <div id="qr-video-container"></div>
    <button type="button" class="close-camera-btn" id="close-camera-btn">Cancel Scan</button>
  </div>

  <script>
    const openCameraBtn = document.getElementById('open-camera-btn');
    const closeCameraBtn = document.getElementById('close-camera-btn');
    const triggerFileBtn = document.getElementById('trigger-file-btn');
    const hiddenFileInput = document.getElementById('hidden-file-input');
    const cameraOverlay = document.getElementById('camera-overlay');
    
    const upiInput = document.getElementById('upi-id');
    const nameInput = document.getElementById('payee-name');

    let html5QrEngineInstance = null;

    // --- NEW LOW-LEVEL ENGINE SETUP: Bypasses standard wrapper failures ---
    openCameraBtn.addEventListener('click', () => {
      cameraOverlay.style.display = 'flex';
      
      // Instantiate engine using the direct element pointer mapping logic
      html5QrEngineInstance = new Html5Qrcode("qr-video-container");

      const cameraConfig = { 
        fps: 10, 
        qrbox: (width, height) => {
          const edge = Math.min(width, height);
          const borderBox = Math.floor(edge * 0.7);
          return { width: borderBox, height: borderBox };
        }
      };

      // Force environmental back camera configuration on modern hardware setups
      html5QrEngineInstance.start(
        { facingMode: "environment" }, 
        cameraConfig, 
        onScanSuccess, 
        onScanFailure
      ).catch(err => {
        alert("Camera startup encountered problems: " + err);
        shutDownLiveCameraSession();
      });
    });

    closeCameraBtn.addEventListener('click', shutDownLiveCameraSession);

    function shutDownLiveCameraSession() {
      if (html5QrEngineInstance && html5QrEngineInstance.isScanning) {
        html5QrEngineInstance.stop().then(() => {
          cameraOverlay.style.display = 'none';
          html5QrEngineInstance = null;
        }).catch(err => {
          console.error("Failsafe tracking error: ", err);
          cameraOverlay.style.display = 'none';
        });
      } else {
        cameraOverlay.style.display = 'none';
      }
    }

    // --- OPTION B: Image File Upload Processor engine module ---
    triggerFileBtn.addEventListener('click', () => {
      hiddenFileInput.click();
    });

    hiddenFileInput.addEventListener('change', event => {
      if (event.target.files.length === 0) return;
      
      const targetImageFile = event.target.files[0];
      const html5QrCodeLocalScanner = new Html5Qrcode("qr-video-container");
      
      html5QrCodeLocalScanner.scanFile(targetImageFile, true)
        .then(decodedText => {
          onScanSuccess(decodedText);
          hiddenFileInput.value = ""; 
        })
        .catch(err => {
          alert("Could not extract a readable UPI structure. Make sure your screenshot is clear.");
          hiddenFileInput.value = ""; 
        });
    });

    // --- Centralized Processing parsing module logic data params ---
    function onScanSuccess(decodedText) {
      if (decodedText.startsWith("upi://pay")) {
        try {
          const queryBlocks = decodedText.replace("upi://pay", "");
          const searchDataParameters = new URLSearchParams(queryBlocks);
          
          const parsedUPIAddress = searchDataParameters.get('pa'); 
          const parsedPayeeName = searchDataParameters.get('pn'); 

          if (parsedUPIAddress) {
            upiInput.value = parsedUPIAddress;
          }
          if (parsedPayeeName) {
            nameInput.value = decodeURIComponent(parsedPayeeName);
          }

          shutDownLiveCameraSession();
        } catch (e) {
          alert("Formatting structural reading parsing system error.");
        }
      } else {
        alert("Invalid QR format structure. Ensure you scan a standard merchant UPI code block setup mapping.");
        shutDownLiveCameraSession();
      }
    }

    function onScanFailure(error) {
      // Intentionally bypassed to optimize render speeds during high-rate capture loops
