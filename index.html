<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>UPI Split Controller</title>
  
  <link href="https://googleapis.com" rel="stylesheet">
  <!-- Load the stable standalone version of the decoder engine -->
  <script src="https://jsdelivr.net"></script>

  <style>
    :root {
      --primary-color: #1a4384; 
      --primary-hover: #123263;
      --text-color: #333333;
      --border-color: #d1d5db;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: 'Inter', sans-serif;
    }

    body {
      background-color: #f8fafc;
      display: flex;
      justify-content: center;
      align-items: flex-start;
      min-height: 100vh;
      padding: 20px 0;
    }

    .app-wrapper {
      width: 100%;
      max-width: 440px;
      background: #ffffff;
      border-radius: 24px;
      overflow: hidden;
      box-shadow: 0 10px 25px rgba(0, 0, 0, 0.05);
    }

    .app-header {
      background: linear-gradient(180deg, #1e4b8f 0%, #163c75 100%);
      padding: 35px 20px;
      text-align: center;
    }

    .app-header h1 {
      color: #ffffff;
      font-size: 22px;
      font-weight: 600;
      letter-spacing: 0.5px;
    }

    .form-container {
      padding: 30px 24px;
    }

    .input-group {
      margin-bottom: 24px;
    }

    .input-group label {
      display: block;
      font-size: 14px;
      font-weight: 600;
      color: #4b5563;
      margin-bottom: 8px;
    }

    input[type="text"], input[type="number"] {
      width: 100%;
      padding: 14px 16px;
      font-size: 16px;
      border: 1px solid var(--border-color);
      border-radius: 12px;
      outline: none;
      color: var(--text-color);
      transition: border-color 0.2s;
    }

    input[type="text"]:focus, input[type="number"]:focus {
      border-color: var(--primary-color);
    }

    .scanner-options-row {
      display: flex;
      gap: 10px;
      margin-top: 10px;
    }

    .action-badge-btn {
      flex: 1;
      background: #f1f5f9;
      border: 1px solid var(--border-color);
      border-radius: 12px;
      padding: 12px;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
      font-weight: 500;
      font-size: 14px;
      color: #4b5563;
      transition: all 0.2s;
    }

    .action-badge-btn:hover {
      background: #e2e8f0;
    }

    .hidden-input {
      display: none !important;
      position: absolute;
      width: 1px;
      height: 1px;
    }

    .submit-btn {
      width: 100%;
      background: var(--primary-color);
      color: #ffffff;
      border: none;
      padding: 16px;
      font-size: 16px;
      font-weight: 600;
      border-radius: 12px;
      cursor: pointer;
      box-shadow: 0 4px 12px rgba(26, 67, 132, 0.2);
      transition: background 0.2s;
      margin-top: 10px;
    }

    .submit-btn:hover {
      background: var(--primary-hover);
    }
  </style>
</head>
<body>

  <div class="app-wrapper">
    <div class="app-header">
      <h1>UPI Split Controller</h1>
    </div>

    <form class="form-container" onsubmit="event.preventDefault();">
      
      <!-- Field 1: Destination UPI ID and Interactive Form Fields -->
      <div class="input-group">
        <label for="upi-id">Destination UPI ID</label>
        <input type="text" id="upi-id" placeholder="e.g., store@okaxis" required>
        
        <div class="scanner-options-row">
          <!-- Direct hardware trigger -->
          <button type="button" class="action-badge-btn" id="btn-camera">
            📷 SCANNER
          </button>
          <!-- Direct static layout photo album gallery selector -->
          <button type="button" class="action-badge-btn" id="btn-gallery">
            🖼️ UPLOAD UPI
          </button>
        </div>

        <!-- Hidden elements containing raw structural handlers -->
        <input type="file" id="input-camera" accept="image/*" capture="environment" class="hidden-input">
        <input type="file" id="input-gallery" accept="image/*" class="hidden-input">
      </div>

      <!-- Field 2: Payee Name verification layout block -->
      <div class="input-group">
        <label for="payee-name">Payee Name</label>
        <input type="text" id="payee-name" placeholder="e.g., Raju Kirana Store" required>
      </div>

      <!-- Field 3: Total Bill Amount parameters setup configuration -->
      <div class="input-group">
        <label for="bill-amount">Total Bill Amount (₹)</label>
        <input type="number" id="bill-amount" placeholder="e.g., 5000" required>
      </div>

      <button type="submit" class="submit-btn">
        Generate Split Links
      </button>
    </form>
  </div>

  <script>
    const btnCamera = document.getElementById('btn-camera');
    const btnGallery = document.getElementById('btn-gallery');
    const inputCamera = document.getElementById('input-camera');
    const inputGallery = document.getElementById('input-gallery');
    
    const upiInput = document.getElementById('upi-id');
    const nameInput = document.getElementById('payee-name');

    // Routing layout triggers to structural system variables cleanly
    btnCamera.addEventListener('click', () => {
      inputCamera.click();
    });
    
    btnGallery.addEventListener('click', () => {
      inputGallery.click();
    });

    // Tracking events captured from image updates
    inputCamera.addEventListener('change', (e) => handleImageParsingStream(e.target.files));
    inputGallery.addEventListener('change', (e) => handleImageParsingStream(e.target.files));

    // FIXED: Bulletproof background canvas parser module
    function handleImageParsingStream(files) {
      if (!files || files.length === 0) return;
      const targetFile = files[0];

      // Convert image data structure to a safe temporary blob URL mapping link
      const temporaryBlobUrl = URL.createObjectURL(targetFile);
      const virtualImage = new Image();

      virtualImage.onload = function() {
        const structuralCanvas = document.createElement('canvas');
        const canvasContext = structuralCanvas.getContext('2d');

        // Limit maximum size dimensions to safely speed up mobile image searches without freezing
        let renderWidth = virtualImage.width;
        let renderHeight = virtualImage.height;
        const maxResolutionMetric = 1000; 

        if (renderWidth > maxResolutionMetric || renderHeight > maxResolutionMetric) {
          if (renderWidth > renderHeight) {
            renderHeight = Math.round((renderHeight * maxResolutionMetric) / renderWidth);
            renderWidth = maxResolutionMetric;
          } else {
            renderWidth = Math.round((renderWidth * maxResolutionMetric) / renderHeight);
            renderHeight = maxResolutionMetric;
          }
        }

        structuralCanvas.width = renderWidth;
        structuralCanvas.height = renderHeight;
        
        // Draw image down into canvas container safely
        canvasContext.drawImage(virtualImage, 0, 0, renderWidth, renderHeight);
        
        try {
          const rawPixelDataBlock = canvasContext.getImageData(0, 0, renderWidth, renderHeight);
          
          // Call the decoder module instantly
          const scanResults = jsQR(rawPixelDataBlock.data, rawPixelDataBlock.width, rawPixelDataBlock.height, {
            inversionAttempts: "dontInvert"
          });

          if (scanResults && scanResults.data) {
            extractAndPopulateUPIStrings(scanResults.data);
          } else {
            alert("No QR Code detected! Please make sure the image is bright, clear, and focused directly on the QR code.");
          }
        } catch (canvasError) {
          alert("Image loading canvas process error: " + canvasError.message);
        } finally {
          // Free browser execution memory links safely
          URL.revokeObjectURL(temporaryBlobUrl);
        }
      };

      virtualImage.onerror = function() {
        alert("Failed to read the image file format properly.");
        URL.revokeObjectURL(temporaryBlobUrl);
      };

      virtualImage.src = temporaryBlobUrl;

      // Clear input fields so you can scan the same file again if needed
      inputCamera.value = "";
      inputGallery.value = "";
    }

    // Shared internal standard parameter value extractor string logic block
    function extractAndPopulateUPIStrings(decodedText) {
      if (decodedText.startsWith("upi://pay")) {
        try {
          const parsingBlocks = decodedText.replace("upi://pay", "");
          const urlDataParameters = new URLSearchParams(parsingBlocks);
          
          const verifiedUPIAddress = urlDataParameters.get('pa'); 
          const verifiedPayeeName = urlDataParameters.get('pn'); 

          if (verifiedUPIAddress) {
            upiInput.value = verifiedUPIAddress;
          }
          if (verifiedPayeeName) {
            nameInput.value = decodeURIComponent(verifiedPayeeName);
          }
        } catch (err) {
          alert("Error parsing structural configuration link deep values setup.");
        }
      } else {
        alert("Scanned successfully, but this code is not a valid standard payment UPI deep link layout format.");
      }
    }
  </script>
</body>
</html>
